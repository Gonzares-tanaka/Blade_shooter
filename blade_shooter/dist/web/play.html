<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090e12">
  <meta name="description" content="BLADE / CLOSE QUARTERS ゲーム専用画面。ドラッグで移動、ダブルタップで斬撃。">
  <title>遊ぶ — BLADE / CLOSE QUARTERS</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="play.css">
</head>
<body>
  <main>
    <header><a class="back-link" href="index.html#play" target="_top" aria-label="紹介ページへ戻る">←</a><span>BLADE <b>CLOSE QUARTERS</b></span><button id="start" type="button" disabled>読み込み中</button></header>
    <nav aria-label="開始設定"><button id="course" type="button" disabled>コース：1面 / 5分＋巨大戦艦（切替）</button><button id="section" type="button" disabled>開始区間：最初から（変更）</button></nav>
    <section id="display" aria-label="ゲーム画面"><div id="pyxel-screen"></div></section>
    <div id="status" role="status">読み込み中… 表示が出たら画面をタップ</div>
    <div id="load-error" role="alert" hidden><p>ゲームを読み込めませんでした。ネット接続を確認して、もう一度お試しください。</p><button id="retry-load" type="button">再読み込み</button></div>
    <footer><span>ドラッグ移動 / ダブルタップ斬撃</span><span>矢印 / Z / Enter / P</span><button id="fullscreen" type="button" hidden>画面拡大 ↗</button></footer>
  </main>
  <script src="touch-config.js"></script>
  <script src="gestures.js"></script>
  <script src="controls.js"></script>
  <script src="runtime.js"></script>
</body>
</html>
