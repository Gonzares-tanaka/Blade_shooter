<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10141d">
  <title>Blade Close Quarters</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><span>BLADE <b>CLOSE QUARTERS</b></span><button id="start" type="button">開始</button></header>
    <nav aria-label="開始設定"><button id="course" type="button" disabled>コース：1面 / 5分＋巨大戦艦（切替）</button><button id="section" type="button" disabled>開始区間：最初から（変更）</button></nav>
    <section id="display" aria-label="ゲーム画面"><div id="pyxel-screen"></div></section>
    <div id="status" role="status">読み込み中… 表示が出たら画面をタップ</div>
    <footer>5分の道中＋巨大戦艦 / OPENに踏み込んで3部位を破壊<br>矢印で移動 / Zで斬撃 / Enterで開始 / Pで一時停止</footer>
  </main>
  <script src="touch-config.js"></script>
  <script src="gestures.js"></script>
  <script src="controls.js"></script>
  <!-- 公式ランタイム。版を固定。オフライン利用には非対応。 -->
  <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel@2.9.9/wasm/pyxel.js"></script>
  <script src="boot.js"></script>
</body>
</html>
