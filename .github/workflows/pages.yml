name: Publish BLADE website

on:
  push:
    branches: [main]
    paths:
      - blade_shooter/web/**
      - blade_shooter/*.py
      - blade_shooter/assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build shared game and website
        run: python3 blade_shooter/build.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: blade_shooter/dist/web
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
