name: Publish BLADE website

on:
  push:
    branches: [main]
    paths:
      - blade_shooter/web/**
      - blade_shooter/*.py
      - blade_shooter/assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build shared game and website
        run: python3 blade_shooter/build.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: blade_shooter/dist/web
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          for attempt in range(20):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  artifacts = json.load(response)["artifacts"]
              if any(item["name"] == "github-pages" and not item["expired"] for item in artifacts):
                  print("Pages artifact metadata is available")
                  break
              print(f"Waiting for artifact metadata ({attempt + 1}/20)")
              time.sleep(3)
          else:
              raise SystemExit("Pages artifact metadata did not become available")
          PY
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
